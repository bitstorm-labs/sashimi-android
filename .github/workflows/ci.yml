name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      # Android Lint on the RELEASE variant, which is where API-level and
      # minification problems surface. It was never run in CI, so a
      # `longVersionCode` call above minSdk shipped unnoticed -- it degraded
      # the Settings screen on Android 8.x rather than failing the build.
      - name: Android Lint (release)
        run: ./gradlew :app:lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-results
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # A minified release build is the only place missing R8 keep rules show
      # up (kotlinx.serialization, Retrofit, Room, Media3 all rely on them).
      # assembleDebug alone would never catch a stripped serializer.
      - name: Assemble release APK (R8)
        run: ./gradlew :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release AAB + signed APK
    # Only on version tags. Signing secrets are optional-guarded: the release
    # build falls back to unsigned when they are absent, so the job stays green
    # even before the keystore secrets are configured.
    if: startsWith(github.ref, 'refs/tags/v')
    # Both jobs trigger on a v* tag push. Without this the two ran CONCURRENTLY,
    # so a red ktlint/test/lint run did not stop the tag from publishing a public
    # GitHub Release and deploying the AAB to the Play internal track. The gate
    # that matters is the tag, so the tag is exactly where the checks must hold.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + attach the APK
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SASHIMI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret configured — building unsigned."
          fi

      - name: Build AAB + APK
        env:
          SASHIMI_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SASHIMI_UPLOAD_STORE_PASSWORD: ${{ secrets.SASHIMI_UPLOAD_STORE_PASSWORD }}
          SASHIMI_UPLOAD_KEY_ALIAS: ${{ secrets.SASHIMI_UPLOAD_KEY_ALIAS }}
          SASHIMI_UPLOAD_KEY_PASSWORD: ${{ secrets.SASHIMI_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      # The Gradle signing config falls back to unsigned when the secrets are
      # absent, which keeps PR builds green but means a lost or rotated keystore
      # secret would publish an UNINSTALLABLE apk to a public GitHub Release
      # instead of failing. A tag is a ship, so verify rather than assume.
      - name: Verify the release artifacts are actually signed
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk is missing - the build produced an unsigned artifact."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sashimi-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Sideload distribution: attach the APK to a GitHub Release for the tag
      # (pattern from sappho-android's build-release workflow).
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # Play internal-testing deploy via fastlane (pipeline ported from
      # sappho-android). Optional-guarded: skips cleanly until the
      # PLAY_STORE_JSON_KEY secret (base64 service-account JSON) is added.
      - name: Decode Play Store key
        id: playkey
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "$PLAY_STORE_JSON_KEY" | base64 --decode > "$RUNNER_TEMP/play-store-key.json"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No PLAY_STORE_JSON_KEY secret — skipping Play deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # fastlane requires Ruby >= 3.3; the runner's system Ruby is 3.2.3.
      - name: Set up Ruby
        if: steps.playkey.outputs.present == 'true'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'

      - name: Deploy to Play internal testing
        if: steps.playkey.outputs.present == 'true'
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ runner.temp }}/play-store-key.json
        run: |
          gem install fastlane --no-document
          fastlane internal

      - name: Cleanup Play key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-store-key.json"
